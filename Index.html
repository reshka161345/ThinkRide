<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThinkRider</title>
<style>
:root{color-scheme:dark;--bg:#0A0A0F;--card:#13131A;--card2:#1C1C26;--line:#1F2937;--mut:#6B7280;--dim:#4B5563;--cy:#00E5FF;--bl:#0066FF;--yl:#FBBF24;--gr:#34D399;--or:#F97316;--vi:#A78BFA;--sky:#60A5FA;--rd:#EF4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.view{display:none;padding:16px}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.mut{color:var(--mut)}
.hero{text-align:center;padding:40px 0 20px}
.hero h1{margin:8px 0 4px;font-size:32px;font-weight:900}
.big{width:100%;padding:18px;border-radius:16px;font-size:17px;font-weight:600;color:#000;background:linear-gradient(90deg,var(--cy),var(--bl))}
.link{background:none;color:var(--mut);font-size:13px;text-decoration:underline;display:block;margin:14px auto}
.err{color:#F87171;font-size:13px;text-align:center;margin:12px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ib{background:none;font-size:20px;padding:6px 8px}
.timer
